<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wandr ATX - Austin Event Guide</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Browse 500+ Austin events. Music, tech, networking, comedy. Filter by type, view on a map, build your schedule.">
  <meta property="og:title" content="Wandr ATX - Austin Event Guide">
  <meta property="og:description" content="500+ Austin events. Music, tech, networking, comedy. Map view, schedule builder, daily updates.">
  <meta property="og:url" content="https://sxswunofficial.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Wandr ATX - Austin Event Guide">
  <meta name="twitter:description" content="500+ Austin events. Music, tech, networking, comedy. Map view, schedule builder, daily updates.">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9GLWBLXG25"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9GLWBLXG25');
  </script>
</head>
<body>
  <div id="app-shell">
    <div class="wrap-banner" id="wrap-banner"><button class="banner-close" id="banner-close">&times;</button><span id="banner-message">Find this useful?</span> <a href="https://www.linkedin.com/in/rebecca-burch/" target="_blank">Let's connect on LinkedIn ↗</a></div>
    <div class="sticky-top">
      <header>
        <div>
          <h1 id="app-title">Wandr ATX</h1>
          <div class="subtitle" id="app-subtitle">SXSW energy. Every week.</div>
        </div>
        <div class="header-stats">
          <div class="stat">Starred: <span id="starred-count">0</span></div>
          <div class="stat">Conflicts: <span id="conflict-count">0</span></div>
          <div class="social-links">
            <a href="https://www.linkedin.com/in/rebecca-burch/" target="_blank" class="social-link" id="linkedin-link" aria-label="LinkedIn">in</a>
            <a href="https://x.com/thinkLikeADev" target="_blank" class="social-link" aria-label="X / Twitter">X</a>
          </div>
        </div>
      </header>
      <nav class="view-tabs">
        <button class="tab active" data-view="discover">Discover</button>
        <button class="tab" data-view="map">Map</button>
        <button class="tab" data-view="resolve">Resolve <span class="tab-badge" id="resolve-badge" style="display:none">0</span></button>
        <button class="tab" data-view="schedule">Schedule</button>
      </nav>
      <div class="controls" id="controls">
        <!-- Day picker is always visible (above the sheet) so navigation
             works without opening the modal. -->
        <div class="filter-row day-filter-row" id="day-filters"></div>
        <!-- Mobile-only icon bar (hidden on desktop via CSS). Tapping the
             filter icon opens the filter-rows as a bottom sheet; tapping
             search opens the same sheet but only the search input. -->
        <div class="mobile-filter-bar">
          <button class="icon-btn" id="mobile-search-btn" aria-label="Search events">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.5" y2="16.5"></line>
            </svg>
          </button>
          <button class="icon-btn" id="mobile-filter-btn" aria-label="Open filters">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
            </svg>
            <span class="filter-active-dot" id="filter-active-dot" hidden></span>
          </button>
        </div>
        <div class="filter-rows" id="filter-rows">
          <div class="sheet-header" id="filter-sheet-header">
            <span class="sheet-grabber" aria-hidden="true"></span>
            <span class="sheet-title">Filters</span>
            <button class="sheet-clear" id="clear-all-filters">Clear all</button>
            <button class="sheet-close" id="filter-sheet-close" aria-label="Close">✕</button>
          </div>
          <div class="filter-row search-row" id="search-filter"></div>
          <div class="filter-row" id="cost-filters"></div>
          <div class="filter-row" id="time-filters"></div>
          <div class="filter-row" id="track-filters"></div>
          <div class="filter-row" id="location-filters"></div>
        </div>
      </div>
      <div class="sheet-backdrop" id="sheet-backdrop"></div>
    </div>
  </div>
  <main id="content"></main>
  <footer class="site-footer">
    Built by Rebecca Burch · <a href="https://www.linkedin.com/in/rebecca-burch/" target="_blank">LinkedIn</a> · <a href="https://x.com/thinkLikeADev" target="_blank">X</a>
  </footer>
  <div class="visitor-badge"><img src="https://api.visitorbadge.io/api/visitors?path=sxsw-event-picker&label=Views&countColor=%234ade80&labelColor=%232a2a2a" alt="Visitor count"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
