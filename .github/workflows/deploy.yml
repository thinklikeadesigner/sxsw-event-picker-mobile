name: Redirect to Vercel

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Create redirect page
        run: |
          mkdir -p dist
          cat > dist/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0;url=https://sxswunofficial.com">
            <link rel="canonical" href="https://sxswunofficial.com">
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="https://sxswunofficial.com">sxswunofficial.com</a>...</p>
          </body>
          </html>
          HTMLEOF
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
